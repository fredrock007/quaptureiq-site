<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="QuaptureIQ public information and legal pages.">
  <title>QuaptureIQ</title>
  <style>
    :root { color-scheme: light; --lavender:#f4f1ff; --navy:#172447; --muted:#56627f; --violet:#6751c8; --cyan:#20a9bb; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(145deg,var(--lavender),#fbfdff 70%); color:var(--navy); font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100% - 2rem,680px); margin:0 auto; padding:clamp(3rem,10vw,6rem) 0; }
    .brand { display:inline-flex; align-items:center; gap:.65rem; color:var(--violet); font-weight:700; letter-spacing:.03em; }
    .mark { width:2rem; height:2rem; display:grid; place-items:center; border-radius:.7rem; color:white; background:linear-gradient(135deg,var(--violet),var(--cyan)); }
    article { margin-top:1.5rem; padding:clamp(1.5rem,5vw,2.75rem); background:#fff; border:1px solid #e5e7f5; border-radius:1.25rem; box-shadow:0 18px 50px rgba(39,42,96,.09); }
    h1 { margin:0 0 .75rem; font-size:clamp(2rem,7vw,3rem); line-height:1.1; }
    p { margin:.8rem 0; color:var(--muted); }
    nav { display:grid; gap:.8rem; margin-top:1.75rem; }
    a { display:block; padding:1rem 1.1rem; border:1px solid #e1ddf5; border-radius:.75rem; color:var(--violet); font-weight:700; text-decoration:none; background:#faf9ff; }
    a:hover, a:focus-visible { border-color:var(--cyan); outline:3px solid #d9f4f6; }
    footer { margin-top:1.5rem; color:var(--muted); font-size:.9rem; text-align:center; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">Q</span>QuaptureIQ</div>
    <article>
      <h1>QuaptureIQ</h1>
      <p>Public information and account-support pages for QuaptureIQ.</p>
      <nav aria-label="QuaptureIQ pages">
        <a href="privacy.html">Privacy policy</a>
        <a href="delete-account.html">Account and data deletion</a>
      </nav>
    </article>
    <footer>QuaptureIQ</footer>
  </main>
</body>
</html>
